# Serves the static Next.js export and proxies the API (incl. WebSockets).
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 4g;

  location /api/ {
    proxy_pass http://api:8765;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
    proxy_buffering off;
  }
  location /_next/static/ { expires 1y; add_header Cache-Control "public, immutable"; }
  # /run -> run.html (a same-named directory with page data also exists)
  location / { try_files $uri.html $uri $uri/index.html =404; }
  error_page 404 /404.html;
}
